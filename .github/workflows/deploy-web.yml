name: Deploy VitaTakip Web App (PWA) to GitHub Pages

# Depo gizli (private) olduğu için ücretsiz planda GitHub Pages kullanılamaz; bu iş akışı yalnızca elle
# çalıştırılır. Depo herkese açık yapılırsa veya ücretli plana geçilirse "push" tetikleyicisi geri eklenebilir.
# Kendi alan adında yayın için netlify.toml veya vercel.json kullanılabilir.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload VitaTakip Web PWA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "app/src/main/assets/vita_web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
